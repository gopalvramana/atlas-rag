spring:
  datasource:
    url: ${DB_URL}?stringtype=unspecified
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: false       # DB already migrated; don't run Flyway again in tests

  jpa:
    hibernate:
      ddl-auto: none

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small

atlas:
  retrieval:
    token-budget: 6000
    search-concurrency: 5
