server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL}?stringtype=unspecified
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small
      chat:
        options:
          model: gpt-4o-mini

atlas:
  llm:
    context-window: 128000
    output-reserve: 1500

  models:
    default-profile: fast
    profiles:
      fast:
        model-id: gpt-4o-mini
        temperature: 0.7
        max-tokens: 4096
      capable:
        model-id: gpt-4o
        temperature: 0.7
        max-tokens: 4096

logging:
  level:
    org.springframework.ai: DEBUG
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
