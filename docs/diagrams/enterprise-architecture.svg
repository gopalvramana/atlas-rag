<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 600 13px -apple-system,'Segoe UI',system-ui,sans-serif; fill:#1a1a2e; }
    .lbl   { font: 600 12px -apple-system,'Segoe UI',system-ui,sans-serif; fill:#1a1a2e; }
    .sub   { font: 400 9.5px 'SF Mono','Cascadia Code','Consolas',monospace; fill:#656d76; }
    .sec   { font: 600 9px -apple-system,'Segoe UI',sans-serif; fill:#656d76; text-transform:uppercase; letter-spacing:.08em; }
    .conn  { stroke:#5046e5; stroke-width:1.5; fill:none; }
  </style>
  <rect width="680" height="300" fill="#ffffff" rx="10"/>
  <text x="24" y="22" class="title">Enterprise Production AI Architecture</text>
  <text x="24" y="37" style="font:400 10px -apple-system,'Segoe UI',sans-serif;fill:#656d76;">Sprint 9 — how would you run this inside a large organisation?</text>

  <!-- API Gateway -->
  <rect x="230" y="52" width="220" height="32" fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="340" y="73" class="lbl" text-anchor="middle">API Gateway</text>
  <line x1="340" y1="84" x2="340" y2="98" class="conn"/>

  <!-- AI Gateway -->
  <rect x="200" y="98" width="280" height="32" fill="rgba(80,70,229,0.1)" stroke="#5046e5" stroke-width="1.5" rx="6"/>
  <text x="340" y="119" class="lbl" text-anchor="middle">AI Gateway / Model Abstraction</text>
  <line x1="340" y1="130" x2="340" y2="144" class="conn"/>

  <!-- Fork -->
  <line x1="130" y1="144" x2="550" y2="144" class="conn"/>
  <line x1="130" y1="144" x2="130" y2="152" class="conn"/>
  <line x1="340" y1="144" x2="340" y2="152" class="conn"/>
  <line x1="550" y1="144" x2="550" y2="152" class="conn"/>

  <!-- Service boxes -->
  <rect x="40"  y="152" width="180" height="48" fill="rgba(80,70,229,0.07)" stroke="#5046e5" stroke-width="1" rx="6"/>
  <text x="130" y="173" class="lbl" text-anchor="middle">RAG Service</text>
  <text x="130" y="188" class="sub" text-anchor="middle">Hybrid retrieval · Reranking</text>

  <rect x="250" y="152" width="180" height="48" fill="rgba(80,70,229,0.07)" stroke="#5046e5" stroke-width="1" rx="6"/>
  <text x="340" y="173" class="lbl" text-anchor="middle">Agent Service</text>
  <text x="340" y="188" class="sub" text-anchor="middle">ReAct · Tool calling</text>

  <rect x="460" y="152" width="180" height="48" fill="rgba(80,70,229,0.07)" stroke="#5046e5" stroke-width="1" rx="6"/>
  <text x="550" y="173" class="lbl" text-anchor="middle">Tool Service</text>
  <text x="550" y="188" class="sub" text-anchor="middle">MCP · External APIs</text>

  <!-- Merge down -->
  <line x1="130" y1="200" x2="130" y2="212" class="conn"/>
  <line x1="340" y1="200" x2="340" y2="212" class="conn"/>
  <line x1="550" y1="200" x2="550" y2="212" class="conn"/>
  <line x1="130" y1="212" x2="550" y2="212" class="conn"/>
  <line x1="340" y1="212" x2="340" y2="222" class="conn"/>

  <!-- Data layer -->
  <rect x="100" y="222" width="480" height="36" fill="rgba(63,185,80,0.08)" stroke="#3fb950" stroke-width="1.5" rx="6"/>
  <text x="340" y="240" class="lbl" text-anchor="middle">Vector DB · Enterprise Data · Event Bus</text>
  <text x="340" y="253" class="sub" text-anchor="middle">pgvector · PostgreSQL · Kafka</text>
  <line x1="340" y1="258" x2="340" y2="272" class="conn"/>

  <!-- Observability -->
  <rect x="180" y="272" width="320" height="22" fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="340" y="288" class="sub" text-anchor="middle" style="fill:#1a1a2e;font-size:10px;">Observability · Evaluation · Security · Governance</text>
</svg>
