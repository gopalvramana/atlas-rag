<svg viewBox="0 0 740 520" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 600 17px -apple-system, 'Segoe UI', system-ui, sans-serif; fill: #1a1a2e; }
    .subtitle { font: 400 11.5px -apple-system, 'Segoe UI', system-ui, sans-serif; fill: #656d76; }
    .class-name { font: 700 13px 'SF Mono', 'Cascadia Code', 'Consolas', monospace; fill: #1a1a2e; }
    .stereotype { font: 400 10px 'SF Mono', 'Cascadia Code', 'Consolas', monospace; fill: #656d76; font-style: italic; }
    .method { font: 400 11px 'SF Mono', 'Cascadia Code', 'Consolas', monospace; fill: #1a1a2e; }
    .annotation { font: 400 10px 'SF Mono', 'Cascadia Code', 'Consolas', monospace; fill: #5046e5; }
    .label { font: 400 11px -apple-system, 'Segoe UI', system-ui, sans-serif; fill: #656d76; }
    .label-bold { font: 600 11px -apple-system, 'Segoe UI', system-ui, sans-serif; fill: #1a1a2e; }
    .callout { font: 400 10.5px -apple-system, 'Segoe UI', system-ui, sans-serif; fill: #656d76; }
    .number { font: 700 11px -apple-system, 'Segoe UI', system-ui, sans-serif; fill: #5046e5; }
    .divider { stroke: #d0d7de; stroke-width: 0.5; }
  </style>

  <!-- Background -->
  <rect width="740" height="520" fill="#ffffff" rx="12" />

  <!-- Title -->
  <text x="24" y="30" class="title">Strategy Pattern — DocumentParser</text>
  <text x="24" y="48" class="subtitle">Open/Closed Principle: add new formats without modifying existing code</text>

  <!-- ═══ CONTEXT: IngestionPipeline ═══ -->
  <rect x="24" y="70" width="260" height="100" fill="rgba(210,153,34,0.08)" stroke="#d29922" stroke-width="1.5" rx="8" />
  <text x="154" y="90" class="stereotype" text-anchor="middle">context</text>
  <text x="154" y="108" class="class-name" text-anchor="middle">IngestionPipeline</text>
  <line x1="34" y1="116" x2="274" y2="116" class="divider" />
  <text x="40" y="133" class="method">- parsers: List&lt;DocumentParser&gt;</text>
  <text x="40" y="150" class="method">+ run()</text>

  <!-- Composition arrow -->
  <line x1="284" y1="120" x2="370" y2="120" stroke="#d29922" stroke-width="1.5" fill="none" />
  <polygon points="284,120 292,114 300,120 292,126" fill="#d29922" />
  <text x="327" y="112" class="label" text-anchor="middle">has many</text>

  <!-- ═══ STRATEGY INTERFACE ═══ -->
  <rect x="370" y="70" width="340" height="100" fill="rgba(80,70,229,0.08)" stroke="#5046e5" stroke-width="1.5" rx="8" />
  <text x="540" y="90" class="stereotype" text-anchor="middle">«interface»</text>
  <text x="540" y="108" class="class-name" text-anchor="middle">DocumentParser</text>
  <line x1="380" y1="116" x2="700" y2="116" class="divider" />
  <text x="386" y="133" class="method">+ supports(filename: String): boolean</text>
  <text x="386" y="150" class="method">+ parse(rawContent: byte[]): String</text>

  <!-- ═══ CONCRETE: AsciiDocParser ═══ -->
  <rect x="60" y="280" width="200" height="112" fill="rgba(63,185,80,0.08)" stroke="#3fb950" stroke-width="1.5" rx="8" />
  <text x="160" y="300" class="annotation" text-anchor="middle">@Component</text>
  <text x="160" y="318" class="class-name" text-anchor="middle">AsciiDocParser</text>
  <line x1="70" y1="326" x2="250" y2="326" class="divider" />
  <text x="76" y="343" class="method">supports("*.adoc")</text>
  <text x="76" y="360" class="method">parse → AsciidoctorJ</text>
  <text x="76" y="377" class="method">     → Jsoup → text</text>

  <!-- ═══ CONCRETE: MarkdownParser ═══ -->
  <rect x="280" y="280" width="200" height="112" fill="rgba(63,185,80,0.08)" stroke="#3fb950" stroke-width="1.5" rx="8" />
  <text x="380" y="300" class="annotation" text-anchor="middle">@Component</text>
  <text x="380" y="318" class="class-name" text-anchor="middle">MarkdownParser</text>
  <line x1="290" y1="326" x2="470" y2="326" class="divider" />
  <text x="296" y="343" class="method">supports("*.md")</text>
  <text x="296" y="360" class="method">parse → commonmark</text>
  <text x="296" y="377" class="method">     → text</text>

  <!-- ═══ FUTURE: PdfParser ═══ -->
  <rect x="500" y="280" width="200" height="112" fill="rgba(0,0,0,0.02)" stroke="#d0d7de" stroke-width="1" rx="8" stroke-dasharray="6 3" />
  <text x="600" y="300" class="annotation" text-anchor="middle">@Component</text>
  <text x="600" y="318" class="class-name" text-anchor="middle">PdfParser</text>
  <line x1="510" y1="326" x2="690" y2="326" class="divider" />
  <text x="516" y="343" class="method">supports("*.pdf")</text>
  <text x="516" y="360" class="method">parse → Apache PDFBox</text>
  <text x="516" y="377" class="method">     → text</text>

  <!-- Implements arrows -->
  <!-- AsciiDoc → Interface -->
  <line x1="160" y1="280" x2="160" y2="220" stroke="#5046e5" stroke-width="1.5" stroke-dasharray="6 3" />
  <line x1="160" y1="220" x2="480" y2="220" stroke="#5046e5" stroke-width="1.5" stroke-dasharray="6 3" />
  <line x1="480" y1="220" x2="480" y2="172" stroke="#5046e5" stroke-width="1.5" stroke-dasharray="6 3" />
  <polygon points="480,172 474,184 486,184" fill="none" stroke="#5046e5" stroke-width="1.5" />

  <!-- Markdown → Interface -->
  <line x1="380" y1="280" x2="380" y2="230" stroke="#5046e5" stroke-width="1.5" stroke-dasharray="6 3" />
  <line x1="380" y1="230" x2="540" y2="230" stroke="#5046e5" stroke-width="1.5" stroke-dasharray="6 3" />
  <line x1="540" y1="230" x2="540" y2="172" stroke="#5046e5" stroke-width="1.5" stroke-dasharray="6 3" />
  <polygon points="540,172 534,184 546,184" fill="none" stroke="#5046e5" stroke-width="1.5" />

  <!-- Pdf → Interface -->
  <line x1="600" y1="280" x2="600" y2="172" stroke="#5046e5" stroke-width="1.5" stroke-dasharray="6 3" />
  <polygon points="600,172 594,184 606,184" fill="none" stroke="#5046e5" stroke-width="1.5" />

  <!-- ═══ FLOW CALLOUT ═══ -->
  <rect x="24" y="420" width="696" height="88" fill="rgba(80,70,229,0.04)" rx="6" />
  <text x="40" y="442" class="label-bold">How it works at runtime:</text>
  <text x="40" y="462" class="number">1</text>
  <text x="54" y="462" class="callout">Spring discovers all @Component classes implementing DocumentParser → injects as List&lt;DocumentParser&gt;</text>
  <text x="40" y="480" class="number">2</text>
  <text x="54" y="480" class="callout">Pipeline calls supports(filename) on each parser → first match wins</text>
  <text x="40" y="498" class="number">3</text>
  <text x="54" y="498" class="callout">Adding PDF support = new @Component class. Zero changes to IngestionPipeline or existing parsers.</text>

  <!-- Legend -->
  <rect x="592" y="420" width="12" height="12" fill="rgba(0,0,0,0.02)" stroke="#d0d7de" stroke-width="1" rx="2" stroke-dasharray="4 2" />
  <text x="610" y="431" class="callout">= future (not yet built)</text>
</svg>
