<svg viewBox="0 0 580 240" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 600 13px -apple-system,'Segoe UI',system-ui,sans-serif; fill:#1a1a2e; }
    .lbl   { font: 600 12px -apple-system,'Segoe UI',system-ui,sans-serif; fill:#1a1a2e; }
    .sub   { font: 400 9.5px 'SF Mono','Cascadia Code','Consolas',monospace; fill:#656d76; }
    .conn  { stroke:#5046e5; stroke-width:1.5; fill:none; }
  </style>
  <rect width="580" height="240" fill="#ffffff" rx="10"/>
  <text x="24" y="22" class="title">MCP Integration</text>
  <text x="24" y="37" style="font:400 10px -apple-system,'Segoe UI',sans-serif;fill:#656d76;">AI client ↔ MCP protocol ↔ Atlas platform</text>

  <!-- AI Clients -->
  <rect x="60"  y="50" width="160" height="34" fill="rgba(80,70,229,0.1)" stroke="#5046e5" stroke-width="1.5" rx="6"/>
  <text x="140" y="72" class="lbl" text-anchor="middle">Claude Desktop</text>
  <rect x="240" y="50" width="160" height="34" fill="rgba(80,70,229,0.1)" stroke="#5046e5" stroke-width="1.5" rx="6"/>
  <text x="320" y="72" class="lbl" text-anchor="middle">Any MCP Client</text>

  <!-- Arrows to MCP -->
  <line x1="140" y1="84"  x2="140" y2="100" class="conn"/>
  <line x1="320" y1="84"  x2="320" y2="100" class="conn"/>
  <line x1="140" y1="100" x2="320" y2="100" class="conn"/>
  <line x1="230" y1="100" x2="230" y2="110" class="conn"/>

  <!-- MCP Protocol -->
  <rect x="120" y="110" width="220" height="32" fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="2" rx="6"/>
  <text x="230" y="130" class="lbl" text-anchor="middle">MCP Protocol</text>
  <line x1="230" y1="142" x2="230" y2="156" class="conn"/>

  <!-- Atlas MCP Server -->
  <rect x="90" y="156" width="280" height="36" fill="rgba(63,185,80,0.1)" stroke="#3fb950" stroke-width="1.5" rx="8"/>
  <text x="230" y="175" class="lbl" text-anchor="middle">Atlas MCP Server</text>
  <text x="230" y="188" class="sub" text-anchor="middle">tools · resources · prompts</text>
  <line x1="230" y1="192" x2="230" y2="206" class="conn"/>

  <!-- Fork to tools -->
  <line x1="100" y1="206" x2="360" y2="206" class="conn"/>
  <line x1="100" y1="206" x2="100" y2="214" class="conn"/>
  <line x1="230" y1="206" x2="230" y2="214" class="conn"/>
  <line x1="360" y1="206" x2="360" y2="214" class="conn"/>

  <rect x="32"  y="214" width="136" height="20" fill="rgba(63,185,80,0.08)" stroke="#3fb950" stroke-width="1" rx="4"/>
  <text x="100" y="228" class="sub" text-anchor="middle" style="font-size:10px;">askAtlas (RAG)</text>
  <rect x="162" y="214" width="136" height="20" fill="rgba(63,185,80,0.08)" stroke="#3fb950" stroke-width="1" rx="4"/>
  <text x="230" y="228" class="sub" text-anchor="middle" style="font-size:10px;">searchDocs</text>
  <rect x="292" y="214" width="136" height="20" fill="rgba(63,185,80,0.08)" stroke="#3fb950" stroke-width="1" rx="4"/>
  <text x="360" y="228" class="sub" text-anchor="middle" style="font-size:10px;">searchGitHub</text>
</svg>
