<svg viewBox="0 0 580 820" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 600 16px -apple-system, 'Segoe UI', system-ui, sans-serif; fill: #1a1a2e; }
    .subtitle { font: 400 10.5px -apple-system, 'Segoe UI', system-ui, sans-serif; fill: #656d76; }
    .box-label { font: 600 12px -apple-system, 'Segoe UI', system-ui, sans-serif; fill: #1a1a2e; }
    .box-detail { font: 400 9.5px 'SF Mono', 'Cascadia Code', 'Consolas', monospace; fill: #656d76; }
    .section-label { font: 600 9px -apple-system, 'Segoe UI', system-ui, sans-serif; fill: #656d76; text-transform: uppercase; letter-spacing: 0.1em; }
    .connector { stroke: #5046e5; stroke-width: 1.5; fill: none; }
    .group-border { fill: none; stroke: #d0d7de; stroke-width: 1; rx: 10; stroke-dasharray: 6 3; }
    .group-label { font: 600 8.5px -apple-system, 'Segoe UI', system-ui, sans-serif; fill: #656d76; text-transform: uppercase; letter-spacing: 0.08em; }
  </style>
  <rect width="580" height="820" fill="#ffffff" rx="12" />

  <!-- Title -->
  <text x="24" y="28" class="title">Query Pipeline</text>
  <text x="24" y="44" class="subtitle">From user question to grounded answer</text>

  <!-- ═══ User Query ═══ -->
  <rect x="190" y="62" width="200" height="40" fill="rgba(80,70,229,0.1)" stroke="#5046e5" stroke-width="1.5" rx="20" />
  <text x="290" y="87" class="box-label" text-anchor="middle">User Query</text>
  <line x1="290" y1="102" x2="290" y2="118" class="connector" />

  <!-- ═══ Query Processing group ═══ -->
  <rect x="140" y="118" width="300" height="110" class="group-border" />
  <rect x="156" y="110" width="120" height="14" fill="#ffffff" />
  <text x="160" y="121" class="group-label">Query Processing</text>

  <rect x="190" y="132" width="200" height="36" fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="1" rx="6" />
  <text x="290" y="152" class="box-label" text-anchor="middle">Query Router</text>
  <text x="290" y="163" class="box-detail" text-anchor="middle">route by intent</text>
  <line x1="290" y1="168" x2="290" y2="180" class="connector" />

  <rect x="190" y="180" width="200" height="36" fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="1" rx="6" />
  <text x="290" y="200" class="box-label" text-anchor="middle">Query Transformation</text>
  <text x="290" y="211" class="box-detail" text-anchor="middle">rewrite · expand · decompose</text>
  <line x1="290" y1="228" x2="290" y2="244" class="connector" />

  <!-- ═══ Dual Retrieval ═══ -->
  <text x="245" y="256" class="section-label" text-anchor="middle">Dual Retrieval</text>

  <!-- Fork lines -->
  <line x1="290" y1="260" x2="290" y2="272" class="connector" />
  <line x1="170" y1="272" x2="410" y2="272" class="connector" />
  <line x1="170" y1="272" x2="170" y2="280" class="connector" />
  <line x1="410" y1="272" x2="410" y2="280" class="connector" />

  <rect x="80" y="280" width="180" height="40" fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="1" rx="6" />
  <text x="170" y="300" class="box-label" text-anchor="middle">Vector Search</text>
  <text x="170" y="313" class="box-detail" text-anchor="middle">pgvector · cosine</text>

  <rect x="320" y="280" width="180" height="40" fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="1" rx="6" />
  <text x="410" y="300" class="box-label" text-anchor="middle">BM25 Search</text>
  <text x="410" y="313" class="box-detail" text-anchor="middle">tsvector · full-text</text>

  <!-- Merge lines -->
  <line x1="170" y1="320" x2="170" y2="332" class="connector" />
  <line x1="410" y1="320" x2="410" y2="332" class="connector" />
  <line x1="170" y1="332" x2="410" y2="332" class="connector" />
  <line x1="290" y1="332" x2="290" y2="348" class="connector" />

  <!-- ═══ Merging & Refinement group ═══ -->
  <rect x="140" y="348" width="300" height="230" class="group-border" />
  <rect x="156" y="340" width="160" height="14" fill="#ffffff" />
  <text x="160" y="351" class="group-label">Result Merging &amp; Refinement</text>

  <rect x="190" y="362" width="200" height="30" fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="1" rx="6" />
  <text x="290" y="381" class="box-label" text-anchor="middle">Fusion — RRF</text>
  <line x1="290" y1="392" x2="290" y2="400" class="connector" />

  <rect x="190" y="400" width="200" height="36" fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="1" rx="6" />
  <text x="290" y="420" class="box-label" text-anchor="middle">Reranker</text>
  <text x="290" y="431" class="box-detail" text-anchor="middle">Cohere cross-encoder</text>
  <line x1="290" y1="436" x2="290" y2="444" class="connector" />

  <rect x="190" y="444" width="200" height="36" fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="1" rx="6" />
  <text x="290" y="464" class="box-label" text-anchor="middle">Metadata Filter</text>
  <text x="290" y="475" class="box-detail" text-anchor="middle">version · source · type</text>
  <line x1="290" y1="480" x2="290" y2="488" class="connector" />

  <rect x="190" y="488" width="200" height="36" fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="1" rx="6" />
  <text x="290" y="508" class="box-label" text-anchor="middle">Parent/Child Context</text>
  <text x="290" y="519" class="box-detail" text-anchor="middle">expand to surrounding chunks</text>
  <line x1="290" y1="524" x2="290" y2="532" class="connector" />

  <rect x="190" y="532" width="200" height="36" fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="1" rx="6" />
  <text x="290" y="552" class="box-label" text-anchor="middle">Context Compression</text>
  <text x="290" y="563" class="box-detail" text-anchor="middle">remove redundancy</text>

  <line x1="290" y1="578" x2="290" y2="594" class="connector" />

  <!-- ═══ LLM ═══ -->
  <rect x="170" y="594" width="240" height="44" fill="rgba(80,70,229,0.1)" stroke="#5046e5" stroke-width="1.5" rx="8" />
  <text x="290" y="616" class="box-label" text-anchor="middle">Claude LLM</text>
  <text x="290" y="630" class="box-detail" text-anchor="middle">Haiku for tools · Sonnet for answer</text>
  <line x1="290" y1="638" x2="290" y2="654" class="connector" />

  <!-- ═══ Output Validation ═══ -->
  <text x="245" y="666" class="section-label" text-anchor="middle">Output Validation</text>

  <line x1="290" y1="670" x2="290" y2="678" class="connector" />
  <line x1="110" y1="678" x2="470" y2="678" class="connector" />
  <line x1="110" y1="678" x2="110" y2="686" class="connector" />
  <line x1="290" y1="678" x2="290" y2="686" class="connector" />
  <line x1="470" y1="678" x2="470" y2="686" class="connector" />

  <rect x="50" y="686" width="120" height="36" fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="1" rx="6" />
  <text x="110" y="706" class="box-label" text-anchor="middle">Citation</text>
  <text x="110" y="717" class="box-detail" text-anchor="middle">validate sources</text>

  <rect x="230" y="686" width="120" height="36" fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="1" rx="6" />
  <text x="290" y="706" class="box-label" text-anchor="middle">Guardrail</text>
  <text x="290" y="717" class="box-detail" text-anchor="middle">safety check</text>

  <rect x="410" y="686" width="120" height="36" fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="1" rx="6" />
  <text x="470" y="706" class="box-label" text-anchor="middle">Confidence</text>
  <text x="470" y="717" class="box-detail" text-anchor="middle">score threshold</text>

  <!-- Merge -->
  <line x1="110" y1="722" x2="110" y2="734" class="connector" />
  <line x1="290" y1="722" x2="290" y2="734" class="connector" />
  <line x1="470" y1="722" x2="470" y2="734" class="connector" />
  <line x1="110" y1="734" x2="470" y2="734" class="connector" />
  <line x1="290" y1="734" x2="290" y2="748" class="connector" />

  <!-- ═══ Answer ═══ -->
  <rect x="190" y="748" width="200" height="40" fill="rgba(63,185,80,0.1)" stroke="#3fb950" stroke-width="1.5" rx="20" />
  <text x="290" y="773" class="box-label" text-anchor="middle">Answer</text>

  <!-- Post-processing labels -->
  <text x="140" y="808" class="section-label">Post: Evaluation + Observability</text>
</svg>
