<svg viewBox="0 0 680 180" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 600 13px -apple-system,'Segoe UI',system-ui,sans-serif; fill:#1a1a2e; }
    .lbl   { font: 600 12px -apple-system,'Segoe UI',system-ui,sans-serif; fill:#1a1a2e; }
    .sub   { font: 400 9.5px 'SF Mono','Cascadia Code','Consolas',monospace; fill:#656d76; }
    .sec   { font: 600 9px -apple-system,'Segoe UI',sans-serif; fill:#656d76; text-transform:uppercase; letter-spacing:.08em; }
    .conn  { stroke:#5046e5; stroke-width:1.5; fill:none; }
  </style>
  <rect width="680" height="180" fill="#ffffff" rx="10"/>
  <text x="24" y="22" class="title">Evaluation &amp; Observability</text>
  <text x="24" y="37" style="font:400 10px -apple-system,'Segoe UI',sans-serif;fill:#656d76;">measure · trace · improve</text>

  <!-- Top box: AI Application -->
  <rect x="220" y="48" width="240" height="32" fill="rgba(80,70,229,0.1)" stroke="#5046e5" stroke-width="1.5" rx="8"/>
  <text x="340" y="69" class="lbl" text-anchor="middle">AI Application</text>
  <line x1="340" y1="80" x2="340" y2="92" class="conn"/>

  <!-- Observability layer -->
  <rect x="190" y="92" width="300" height="28" fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="340" y="111" class="lbl" text-anchor="middle">Observability</text>

  <!-- Fork lines -->
  <line x1="340" y1="120" x2="340" y2="130" class="conn"/>
  <line x1="100" y1="130" x2="580" y2="130" class="conn"/>
  <line x1="100" y1="130" x2="100" y2="138" class="conn"/>
  <line x1="250" y1="130" x2="250" y2="138" class="conn"/>
  <line x1="430" y1="130" x2="430" y2="138" class="conn"/>
  <line x1="580" y1="130" x2="580" y2="138" class="conn"/>

  <!-- Metric boxes -->
  <rect x="32"  y="138" width="136" height="32" fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="100" y="153" class="lbl" text-anchor="middle" style="font-size:11px;">Latency</text>
  <text x="100" y="165" class="sub" text-anchor="middle">per pipeline stage</text>

  <rect x="182" y="138" width="136" height="32" fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="250" y="153" class="lbl" text-anchor="middle" style="font-size:11px;">Token Cost</text>
  <text x="250" y="165" class="sub" text-anchor="middle">per request</text>

  <rect x="362" y="138" width="136" height="32" fill="rgba(63,185,80,0.1)" stroke="#3fb950" stroke-width="1" rx="5"/>
  <text x="430" y="153" class="lbl" text-anchor="middle" style="font-size:11px;">Quality</text>
  <text x="430" y="165" class="sub" text-anchor="middle">relevance · groundedness</text>

  <rect x="512" y="138" width="136" height="32" fill="rgba(63,185,80,0.1)" stroke="#3fb950" stroke-width="1" rx="5"/>
  <text x="580" y="153" class="lbl" text-anchor="middle" style="font-size:11px;">Hallucination</text>
  <text x="580" y="165" class="sub" text-anchor="middle">detection rate</text>
</svg>
