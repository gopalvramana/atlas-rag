<svg viewBox="0 0 580 220" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 600 13px -apple-system,'Segoe UI',system-ui,sans-serif; fill:#1a1a2e; }
    .lbl   { font: 600 12px -apple-system,'Segoe UI',system-ui,sans-serif; fill:#1a1a2e; }
    .sub   { font: 400 9.5px 'SF Mono','Cascadia Code','Consolas',monospace; fill:#656d76; }
    .conn  { stroke:#5046e5; stroke-width:1.5; fill:none; }
  </style>
  <rect width="580" height="220" fill="#ffffff" rx="10"/>
  <text x="24" y="22" class="title">Hybrid Retrieval</text>
  <text x="24" y="37" style="font:400 10px -apple-system,'Segoe UI',sans-serif;fill:#656d76;">vector search + BM25 fused via RRF</text>

  <!-- Query -->
  <rect x="190" y="48" width="200" height="36" fill="rgba(80,70,229,0.1)" stroke="#5046e5" stroke-width="1.5" rx="20"/>
  <text x="290" y="71" class="lbl" text-anchor="middle">Query</text>

  <!-- Fork -->
  <line x1="290" y1="84"  x2="290" y2="100" class="conn"/>
  <line x1="150" y1="100" x2="430" y2="100" class="conn"/>
  <line x1="150" y1="100" x2="150" y2="110" class="conn"/>
  <line x1="430" y1="100" x2="430" y2="110" class="conn"/>

  <!-- Vector Search -->
  <rect x="60"  y="110" width="180" height="44" fill="rgba(80,70,229,0.08)" stroke="#5046e5" stroke-width="1" rx="6"/>
  <text x="150" y="130" class="lbl" text-anchor="middle">Vector Search</text>
  <text x="150" y="145" class="sub" text-anchor="middle">pgvector · cosine</text>

  <!-- BM25 -->
  <rect x="340" y="110" width="180" height="44" fill="rgba(210,153,34,0.12)" stroke="#d29922" stroke-width="1" rx="6"/>
  <text x="430" y="130" class="lbl" text-anchor="middle">BM25 Search</text>
  <text x="430" y="145" class="sub" text-anchor="middle">tsvector · full-text</text>

  <!-- Merge -->
  <line x1="150" y1="154" x2="150" y2="168" class="conn"/>
  <line x1="430" y1="154" x2="430" y2="168" class="conn"/>
  <line x1="150" y1="168" x2="430" y2="168" class="conn"/>
  <line x1="290" y1="168" x2="290" y2="178" class="conn"/>

  <!-- RRF -->
  <rect x="190" y="178" width="200" height="36" fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="290" y="201" class="lbl" text-anchor="middle">RRF → Top-K</text>
</svg>
