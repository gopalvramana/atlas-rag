<svg viewBox="0 0 620 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#5046e5"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
  </defs>
  <style>
    .title  { font: 600 13px -apple-system,'Segoe UI',system-ui,sans-serif; fill:#1a1a2e; }
    .lbl    { font: 600 12px -apple-system,'Segoe UI',system-ui,sans-serif; fill:#1a1a2e; }
    .sub    { font: 400 9.5px 'SF Mono','Cascadia Code','Consolas',monospace; fill:#656d76; }
    .tag    { font: 600 8.5px -apple-system,'Segoe UI',sans-serif; fill:#656d76; text-transform:uppercase; letter-spacing:.1em; }
    .conn   { stroke:#5046e5; stroke-width:1.5; fill:none; }
    .conn-g { stroke:#3fb950; stroke-width:1.5; fill:none; }
  </style>

  <rect width="620" height="520" fill="#ffffff" rx="12"/>

  <!-- ── QUERY ── -->
  <text x="310" y="28" class="tag" text-anchor="middle">Input</text>
  <rect x="185" y="36" width="250" height="40" rx="20"
        fill="rgba(80,70,229,0.12)" stroke="#5046e5" stroke-width="1.5"/>
  <text x="310" y="61" class="lbl" text-anchor="middle">User Query</text>

  <!-- fork line down then split -->
  <line x1="310" y1="76" x2="310" y2="96" class="conn" marker-end="url(#arr)"/>
  <line x1="135" y1="96" x2="485" y2="96" class="conn"/>
  <line x1="135" y1="96" x2="135" y2="112" class="conn" marker-end="url(#arr)"/>
  <line x1="485" y1="96" x2="485" y2="112" class="conn" marker-end="url(#arr)"/>

  <!-- ── LEFT: VECTOR SEARCH ── -->
  <text x="135" y="110" class="tag" text-anchor="middle">Semantic</text>
  <rect x="40" y="118" width="190" height="52" rx="8"
        fill="rgba(80,70,229,0.08)" stroke="#5046e5" stroke-width="1.5"/>
  <text x="135" y="140" class="lbl" text-anchor="middle">Vector Search</text>
  <text x="135" y="155" class="sub" text-anchor="middle">pgvector · cosine ·  · Top-K</text>

  <!-- ── RIGHT: BM25 ── -->
  <text x="485" y="110" class="tag" text-anchor="middle">Lexical</text>
  <rect x="390" y="118" width="190" height="52" rx="8"
        fill="rgba(210,153,34,0.1)" stroke="#d29922" stroke-width="1.5"/>
  <text x="485" y="140" class="lbl" text-anchor="middle">BM25 Search</text>
  <text x="485" y="155" class="sub" text-anchor="middle">tsvector · ts_rank · Top-K</text>

  <!-- merge lines -->
  <line x1="135" y1="170" x2="135" y2="200" class="conn"/>
  <line x1="485" y1="170" x2="485" y2="200" class="conn"/>
  <line x1="135" y1="200" x2="485" y2="200" class="conn"/>
  <line x1="310" y1="200" x2="310" y2="216" class="conn" marker-end="url(#arr)"/>

  <!-- ── RRF ── -->
  <text x="310" y="214" class="tag" text-anchor="middle">Merge</text>
  <rect x="170" y="220" width="280" height="52" rx="8"
        fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="310" y="242" class="lbl" text-anchor="middle">Reciprocal Rank Fusion</text>
  <text x="310" y="257" class="sub" text-anchor="middle">score(c) = 1/(60+rank_vec) + 1/(60+rank_bm25)</text>

  <line x1="310" y1="272" x2="310" y2="290" class="conn" marker-end="url(#arr)"/>

  <!-- ── RERANK ── -->
  <text x="310" y="288" class="tag" text-anchor="middle">Refine</text>
  <rect x="170" y="294" width="280" height="52" rx="8"
        fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="310" y="316" class="lbl" text-anchor="middle">Reranker</text>
  <text x="310" y="331" class="sub" text-anchor="middle">score = 0.7 × vec + 0.3 × bm25  (→ cross-encoder later)</text>

  <line x1="310" y1="346" x2="310" y2="364" class="conn" marker-end="url(#arr)"/>

  <!-- ── CONTEXT SELECTOR ── -->
  <text x="310" y="362" class="tag" text-anchor="middle">Budget</text>
  <rect x="130" y="368" width="360" height="56" rx="8"
        fill="rgba(0,0,0,0.03)" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="310" y="390" class="lbl" text-anchor="middle">Context Selection + Token-Aware Trimming</text>
  <text x="310" y="405" class="sub" text-anchor="middle">pick top-ranked chunks · jtokkit token count · drop when budget hit</text>
  <text x="310" y="418" class="sub" text-anchor="middle">dedup overlapping chunks</text>

  <line x1="310" y1="424" x2="310" y2="444" class="conn-g" marker-end="url(#arr-g)"/>

  <!-- ── OUTPUT ── -->
  <text x="310" y="442" class="tag" text-anchor="middle">Output → Sprint 4</text>
  <rect x="155" y="448" width="310" height="52" rx="8"
        fill="rgba(63,185,80,0.1)" stroke="#3fb950" stroke-width="2"/>
  <text x="310" y="470" class="lbl" text-anchor="middle">RetrievedContext</text>
  <text x="310" y="485" class="sub" text-anchor="middle">ranked chunks · source · version · score · token count</text>
  <text x="310" y="498" class="sub" text-anchor="middle">ready for PromptAssembler (Sprint 4)</text>
</svg>
